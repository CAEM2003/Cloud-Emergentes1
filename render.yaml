# Blueprint opcional: en Render → New → Blueprint → conecta este repo.
# Tras el primer deploy, añade en Environment la variable DATABASE_URL (URI Postgres de Supabase).
services:
  - type: web
    name: contactos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT lo define Render; hypercorn explícito evita rarezas con Python 3.14 por defecto.
    startCommand: hypercorn app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
